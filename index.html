<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorry</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #0a0a14;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            cursor: none;
        }
        canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0;
        }
        .container {
            position: relative; z-index: 1;
            text-align: center; pointer-events: none;
        }
        .lorry {
            font-size: clamp(4rem, 12vw, 10rem); font-weight: 900; letter-spacing: 0.05em;
            background: linear-gradient(120deg, #a78bfa, #60a5fa, #34d399);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite alternate;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle {
            color: rgba(255,255,255,0.5); font-size: 1.2rem;
            letter-spacing: 0.3em; margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="container">
        <h1 class="lorry">Lorry</h1>
        <p class="subtitle">— Welcome —</p>
    </div>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let W, H;

        const mouse = {
            x: -9999, y: -9999,   // current (smoothed)
            tx: 0, ty: 0,          // target (raw)
            px: 0, py: 0,          // previous frame
            idle: 0,               // idle frames counter
            moving: false
        };

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        window.addEventListener("mousemove", (e) => {
            mouse.tx = e.clientX;
            mouse.ty = e.clientY;
        });
        window.addEventListener("touchmove", (e) => {
            mouse.tx = e.touches[0].clientX;
            mouse.ty = e.touches[0].clientY;
        }, { passive: true });

        // Init mouse at center
        mouse.x = mouse.tx = mouse.px = W / 2;
        mouse.y = mouse.ty = mouse.py = H / 2;

        class Particle {
            constructor() {
                this.reset(true, true);
            }

            reset(init, randomPos) {
                if (randomPos) {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                } else {
                    const a = Math.random() * Math.PI * 2;
                    const r = 80 + Math.random() * 250;
                    this.x = mouse.x + Math.cos(a) * r;
                    this.y = mouse.y + Math.sin(a) * r;
                }
                this.vx = 0; this.vy = 0;
                this.size = Math.random() * 2.5 + 1;
                this.opacity = 0; this.life = 0;
                this.maxLife = 180 + Math.random() * 300;
                this.hue = 250 + Math.random() * 80;
            }

            update(mouseMoving) {
                this.life++;

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;

                if (mouseMoving) {
                    // --- Mouse moving: particles swarm to cursor ---
                    const force = Math.min(dist / 60, 3.5) * 0.07;
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                    this.vx += (Math.random() - 0.5) * 0.12;
                    this.vy += (Math.random() - 0.5) * 0.12;
                } else {
                    // --- Mouse idle: particles float upward gently ---
                    this.vy -= 0.015 + Math.random() * 0.01; // Float up
                    this.vx += (Math.random() - 0.5) * 0.06; // Slight horizontal drift
                    // Gentle spread away from center
                    const cdx = this.x - W / 2;
                    this.vx += cdx * 0.00002;
                }

                // Speed cap
                const maxSpeed = mouseMoving ? 5 : 2;
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }

                // Damping
                this.vx *= mouseMoving ? 0.97 : 0.995;
                this.vy *= mouseMoving ? 0.97 : 0.995;

                this.x += this.vx;
                this.y += this.vy;

                // Fade
                const fadeIn = 20, fadeOut = 30;
                if (this.life < fadeIn) {
                    this.opacity = this.life / fadeIn;
                } else if (this.life > this.maxLife - fadeOut) {
                    this.opacity = (this.maxLife - this.life) / fadeOut;
                } else {
                    this.opacity = 1;
                }
                this.opacity = Math.max(0, Math.min(1, this.opacity));

                // Respawn
                const margin = mouseMoving ? 100 : 50;
                if (this.life > this.maxLife ||
                    this.x < -margin || this.x > W + margin ||
                    this.y < -margin || this.y > H + margin) {
                    this.reset(false, !mouseMoving);
                    this.life = 0;
                    this.opacity = 0;
                }
            }

            draw() {
                if (this.opacity <= 0.02) return;
                const a = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${a * 0.7})`;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${a * 0.1})`;
                ctx.fill();
            }
        }

        const COUNT = 200;
        const particles = Array.from({ length: COUNT }, () => new Particle());

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i], b = particles[j];
                    if (a.opacity < 0.15 || b.opacity < 0.15) continue;
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 70) {
                        const alpha = (1 - dist / 70) * 0.07;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(167,139,250,${alpha})`;
                        ctx.lineWidth = 0.4;
                        ctx.stroke();
                    }
                }
            }
        }

        function drawMouseRing() {
            if (!mouse.moving) return; // Only show ring when moving
            const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 100);
            g.addColorStop(0, "rgba(167,139,250,0.25)");
            g.addColorStop(0.4, "rgba(96,165,250,0.08)");
            g.addColorStop(1, "rgba(96,165,250,0)");
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 100, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();
        }

        function animate() {
            ctx.clearRect(0, 0, W, H);

            // Smooth mouse position
            mouse.x += (mouse.tx - mouse.x) * 0.18;
            mouse.y += (mouse.ty - mouse.y) * 0.18;

            // Detect if mouse is moving
            const moveDist = Math.sqrt(
                (mouse.x - mouse.px) ** 2 + (mouse.y - mouse.py) ** 2
            );
            if (moveDist > 0.3) {
                mouse.idle = 0;
                mouse.moving = true;
            } else {
                mouse.idle++;
                if (mouse.idle > 15) mouse.moving = false; // ~0.25s of stillness
            }
            mouse.px = mouse.x;
            mouse.py = mouse.y;

            drawLines();
            drawMouseRing();

            for (const p of particles) {
                p.update(mouse.moving);
                p.draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
