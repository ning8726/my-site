<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorry</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #0a0a14;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            cursor: none;
        }
        canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0;
        }
        .container {
            position: relative; z-index: 1;
            text-align: center; pointer-events: none;
        }
        .lorry {
            font-size: clamp(4rem, 12vw, 10rem); font-weight: 900; letter-spacing: 0.05em;
            background: linear-gradient(120deg, #a78bfa, #60a5fa, #34d399);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite alternate;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle {
            color: rgba(255,255,255,0.5); font-size: 1.2rem;
            letter-spacing: 0.3em; margin-top: 0.5rem;
        }

        /* Name Prompt Overlay */
        .name-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            display: flex; justify-content: center; align-items: center;
            cursor: default;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .name-overlay.hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }
        .name-dialog {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: dialogIn 0.5s ease;
        }
        @keyframes dialogIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .name-dialog h2 {
            color: #fff; font-size: 1.5rem; margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .name-dialog p {
            color: rgba(255,255,255,0.5); font-size: 0.9rem; margin-bottom: 1.5rem;
        }
        .name-dialog input {
            width: 100%; padding: 0.85rem 1rem;
            border: 1px solid rgba(167, 139, 250, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff; font-size: 1.1rem;
            outline: none; text-align: center;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .name-dialog input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
        }
        .name-dialog input::placeholder {
            color: rgba(255,255,255,0.25);
        }
        .name-dialog button {
            margin-top: 1.2rem;
            padding: 0.75rem 2.5rem;
            border: none; border-radius: 12px;
            background: linear-gradient(120deg, #a78bfa, #60a5fa);
            color: #fff; font-size: 1rem; font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .name-dialog button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(167, 139, 250, 0.3);
        }
        .name-dialog button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Name Prompt -->
    <div class="name-overlay" id="nameOverlay">
        <div class="name-dialog">
            <h2>👋 欢迎</h2>
            <p>请输入你的名字</p>
            <input type="text" id="nameInput" placeholder="你的名字..." maxlength="30" autofocus>
            <br>
            <button id="nameBtn">进入</button>
        </div>
    </div>

    <div class="container">
        <h1 class="lorry" id="displayName">Lorry</h1>
        <p class="subtitle">— Welcome to my website! —</p>
    </div>

    <script>
        // ── Name prompt logic ──
        const overlay = document.getElementById("nameOverlay");
        const nameInput = document.getElementById("nameInput");
        const nameBtn = document.getElementById("nameBtn");
        const displayName = document.getElementById("displayName");
        const STORAGE_KEY = "userName";

        function applyName(name) {
            displayName.textContent = name;
            document.title = name;
        }

        // Check localStorage for saved name
        const savedName = localStorage.getItem(STORAGE_KEY);
        if (savedName && savedName.trim()) {
            applyName(savedName.trim());
            overlay.classList.add("hidden");
        }

        function submitName() {
            const name = nameInput.value.trim();
            if (!name) {
                nameInput.focus();
                return;
            }
            localStorage.setItem(STORAGE_KEY, name);
            applyName(name);
            overlay.classList.add("hidden");
        }

        nameBtn.addEventListener("click", submitName);
        nameInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") submitName();
        });

        // Auto-focus the input if overlay is visible
        if (!overlay.classList.contains("hidden")) {
            nameInput.focus();
        }

        // ── Particle animation ──
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let W, H;

        const mouse = {
            x: -9999, y: -9999,
            tx: 0, ty: 0,
            px: 0, py: 0,
            idle: 0,
            moving: false
        };

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        window.addEventListener("mousemove", (e) => {
            mouse.tx = e.clientX;
            mouse.ty = e.clientY;
        });
        window.addEventListener("touchmove", (e) => {
            mouse.tx = e.touches[0].clientX;
            mouse.ty = e.touches[0].clientY;
        }, { passive: true });

        mouse.x = mouse.tx = mouse.px = W / 2;
        mouse.y = mouse.ty = mouse.py = H / 2;

        class Particle {
            constructor() {
                this.reset(true, true);
            }
            reset(init, randomPos) {
                if (randomPos) {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                } else {
                    const a = Math.random() * Math.PI * 2;
                    const r = 80 + Math.random() * 250;
                    this.x = mouse.x + Math.cos(a) * r;
                    this.y = mouse.y + Math.sin(a) * r;
                }
                this.vx = 0; this.vy = 0;
                this.size = Math.random() * 2.5 + 1;
                this.opacity = 0; this.life = 0;
                this.maxLife = 180 + Math.random() * 300;
                this.hue = 250 + Math.random() * 80;
            }
            update(mouseMoving) {
                this.life++;
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                if (mouseMoving) {
                    const force = Math.min(dist / 60, 3.5) * 0.07;
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                    this.vx += (Math.random() - 0.5) * 0.12;
                    this.vy += (Math.random() - 0.5) * 0.12;
                } else {
                    this.vy -= 0.015 + Math.random() * 0.01;
                    this.vx += (Math.random() - 0.5) * 0.06;
                    const cdx = this.x - W / 2;
                    this.vx += cdx * 0.00002;
                }
                const maxSpeed = mouseMoving ? 5 : 2;
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }
                this.vx *= mouseMoving ? 0.97 : 0.995;
                this.vy *= mouseMoving ? 0.97 : 0.995;
                this.x += this.vx;
                this.y += this.vy;
                const fadeIn = 20, fadeOut = 30;
                if (this.life < fadeIn) {
                    this.opacity = this.life / fadeIn;
                } else if (this.life > this.maxLife - fadeOut) {
                    this.opacity = (this.maxLife - this.life) / fadeOut;
                } else {
                    this.opacity = 1;
                }
                this.opacity = Math.max(0, Math.min(1, this.opacity));
                const margin = mouseMoving ? 100 : 50;
                if (this.life > this.maxLife ||
                    this.x < -margin || this.x > W + margin ||
                    this.y < -margin || this.y > H + margin) {
                    this.reset(false, !mouseMoving);
                    this.life = 0;
                    this.opacity = 0;
                }
            }
            draw() {
                if (this.opacity <= 0.02) return;
                const a = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${a * 0.7})`;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${a * 0.1})`;
                ctx.fill();
            }
        }

        const COUNT = 200;
        const particles = Array.from({ length: COUNT }, () => new Particle());

        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i], b = particles[j];
                    if (a.opacity < 0.15 || b.opacity < 0.15) continue;
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 70) {
                        const alpha = (1 - dist / 70) * 0.07;
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(167,139,250,${alpha})`;
                        ctx.lineWidth = 0.4;
                        ctx.stroke();
                    }
                }
            }
        }

        function drawMouseRing() {
            if (!mouse.moving) return;
            const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 100);
            g.addColorStop(0, "rgba(167,139,250,0.25)");
            g.addColorStop(0.4, "rgba(96,165,250,0.08)");
            g.addColorStop(1, "rgba(96,165,250,0)");
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 100, 0, Math.PI * 2);
            ctx.fillStyle = g;
            ctx.fill();
        }

        function animate() {
            ctx.clearRect(0, 0, W, H);
            mouse.x += (mouse.tx - mouse.x) * 0.18;
            mouse.y += (mouse.ty - mouse.y) * 0.18;
            const moveDist = Math.sqrt(
                (mouse.x - mouse.px) ** 2 + (mouse.y - mouse.py) ** 2
            );
            if (moveDist > 0.3) {
                mouse.idle = 0;
                mouse.moving = true;
            } else {
                mouse.idle++;
                if (mouse.idle > 15) mouse.moving = false;
            }
            mouse.px = mouse.x;
            mouse.py = mouse.y;
            drawLines();
            drawMouseRing();
            for (const p of particles) {
                p.update(mouse.moving);
                p.draw();
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
